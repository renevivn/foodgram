version: '3.3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    depends_on:
      db:
        condition: service_healthy
    restart: always
    image: rivn/foodgram_backend
    env_file: .env
    volumes:
      - media:/app/media
      - static:/app/collected_static

  frontend:
    image: rivn/foodgram_frontend
    depends_on: 
      - backend
    command: cp -r /app/build/. /static/
    restart: on-failure
    volumes:
      - static:/static

  nginx:
    image: rivn/foodgram_gateway
    depends_on:
      - backend
    restart: always
    ports:
      - "80:80"
    volumes:
      - static:/staticfiles
      - media:/usr/share/nginx/html/media/
